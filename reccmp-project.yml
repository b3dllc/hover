targets:
  HOVER:
    filename: hover.exe
    source-root:
      - src
    hash:
      sha256: e49b284bed8773bc2a14f4977d1be4ce5eedd1df79896e7b556e7eb538e2f09a
    # Names for the original, which carries no symbols of its own:
    #  - orig_library.csv: its statically linked MFC 3.1 / CRT functions, so
    #    that a library call scores as a match instead of `call <OFFSET>`.
    #    Generated by tools/libmatch.py; marked `library`, so
    #    tools/compare.py's --nolib keeps them out of the report.
    #  - orig_data.csv: its data - MFC/CRT globals, vtables, CRuntimeClass
    #    objects and the game globals whose `// GLOBAL:` marker is missing or
    #    impossible - so that `mov ecx, <OFFSET4>` scores as a match against
    #    `mov ecx, ?g_strReadFileError@@3VCString@@A`. Generated by
    #    tools/datamatch.py; marked `global`, so they are data entities and
    #    never enter the function count.
    data-sources:
      - tools/orig_library.csv
      - tools/orig_data.csv
